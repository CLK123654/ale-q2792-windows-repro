name: q2792-windows-repro
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: reference
        type: choice
        options: [reference, verify]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu24.04 for WSL2
        shell: pwsh
        run: |
          $distros=@(wsl.exe --list --quiet|ForEach-Object{$_.Trim()}|Where-Object{$_})
          if($distros -notcontains 'Ubuntu-24.04'){wsl.exe --install --distribution Ubuntu-24.04 --no-launch --web-download;if($LASTEXITCODE -ne 0){throw 'Ubuntu24.04 installation failed'}}
          wsl.exe --set-default-version 2
          if($LASTEXITCODE -ne 0){throw 'WSL2 setup failed'}
          wsl.exe -d Ubuntu-24.04 -- bash -lc 'uname -a'
      - name: Record Windows and WSL host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence|Out-Null
          [ordered]@{caption=(Get-CimInstance Win32_OperatingSystem).Caption;version=(Get-CimInstance Win32_OperatingSystem).Version;build=(Get-CimInstance Win32_OperatingSystem).BuildNumber;runner_image=$env:ImageOS;node_version=(node --version);wsl_version=((wsl.exe --version)-join "`n");distribution=(wsl.exe -d Ubuntu-24.04 -- bash -lc 'source /etc/os-release; echo $PRETTY_NAME').Trim();commit_sha=$env:GITHUB_SHA;workflow_run_id=$env:GITHUB_RUN_ID}|ConvertTo-Json|Set-Content -Encoding utf8NoBOM evidence/windows-host.json
      - name: Install Apache Airflow in WSL2
        shell: pwsh
        run: |
          $repoWindows=(Resolve-Path '.').Path;$drive=$repoWindows.Substring(0,1).ToLowerInvariant();$rest=$repoWindows.Substring(2).Replace('\','/');$repoWsl="/mnt/$drive$rest"
          wsl.exe -d Ubuntu-24.04 -- bash -lc "set -e; sudo apt-get update; sudo apt-get install -y python3-venv python3-pip; cd '$repoWsl'; python3 -m venv .venv; source .venv/bin/activate; python -m pip install --upgrade pip; python -m pip install 'apache-airflow==2.10.5' --constraint 'https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt'"
      - name: Generate Reference candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reference' }}
        shell: pwsh
        run: ./qa/wsl_wrapper.ps1 -Mode reference
      - name: Verify attachment hashes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          $repoWindows=(Resolve-Path '.').Path;$drive=$repoWindows.Substring(0,1).ToLowerInvariant();$rest=$repoWindows.Substring(2).Replace('\','/');$repoWsl="/mnt/$drive$rest"
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd '$repoWsl'; source .venv/bin/activate; python ./qa/verify_hashes.py"
      - name: Block WSL external network
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          $repoWindows=(Resolve-Path '.').Path;$drive=$repoWindows.Substring(0,1).ToLowerInvariant();$rest=$repoWindows.Substring(2).Replace('\','/');$repoWsl="/mnt/$drive$rest"
          wsl.exe -d Ubuntu-24.04 -- bash "$repoWsl/qa/block_network.sh" "$repoWsl"
      - name: Verify final task in WSL2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify' }}
        shell: pwsh
        run: ./qa/wsl_wrapper.ps1 -Mode verify
      - name: Remove WSL network guard
        if: always()
        shell: pwsh
        run: wsl.exe --shutdown
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: q2792-windows-evidence, path: 'evidence/**', if-no-files-found: error, retention-days: 1}
